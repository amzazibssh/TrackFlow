# Oracle en prod, H2 en mémoire pour les tests.
# DB_CLOSE_DELAY=-1 garde la base vivante entre les connexions.
spring.datasource.url=jdbc:h2:mem:identity;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Si le contexte ne démarre pas sans broker Kafka, exclure son autoconfiguration ici :
# spring.autoconfigure.exclude=<classe d'autoconfiguration Kafka>

jwt.secret=dGVzdC1zZWNyZXQta2V5LXRlc3Qtc2VjcmV0LWtleS10ZXN0LXNlY3JldC1rZXk=
jwt.expiration=3600000